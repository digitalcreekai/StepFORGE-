<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff1e8">
<title>Shopping Cart — StepForge</title>
<style>
:root{--cream:#fff1e8;--blue:#3b6683;--blue2:#b8d3e4;--ink:#142b3a;--brown:#875632;--muted:#667784;--white:#fffaf6;--line:#d6e0e6;--panel:#bbc2d5}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,a,select{font:inherit}button{cursor:pointer}.cart-header{min-height:104px;padding:14px 4%;display:flex;align-items:center;justify-content:space-between;gap:24px;background:rgba(255,241,232,.97);border-bottom:1px solid #eadbd1}.brand-logo{display:block;width:300px;height:76px;object-fit:contain;transform:translateX(-11px)}.back-link{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border:1.5px solid var(--blue);border-radius:14px;color:var(--blue);text-decoration:none;font-weight:850}.cart-main{width:min(1250px,92%);margin:54px auto 90px}.cart-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.cart-heading h1{font-size:clamp(34px,5vw,52px);margin:0 0 8px;letter-spacing:-1.5px}.cart-heading p{margin:0;color:var(--muted)}.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;align-items:start}.cart-items{display:grid;gap:14px}.cart-item{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px;background:var(--white);border:1px solid var(--line);border-radius:20px}.item-image{width:150px;height:132px;background:var(--panel);border-radius:14px;display:grid;place-items:center;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:contain}.item-brand{font-size:12px;letter-spacing:1.5px;font-weight:900;color:var(--blue);text-transform:uppercase}.item-name{font-size:20px;margin:5px 0 12px}.item-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.size-select{border:1px solid #afc3d0;border-radius:10px;padding:9px 12px;background:white;color:var(--ink)}.quantity{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}.quantity button{border:0;background:#edf0f2;width:36px;height:36px;font-weight:900}.quantity span{min-width:38px;text-align:center;font-weight:850}.remove{border:0;background:transparent;color:#9a433b;text-decoration:underline;font-weight:750}.item-price{font-size:18px;font-weight:900;white-space:nowrap}.summary{position:sticky;top:24px;padding:24px;background:var(--white);border:1px solid var(--line);border-radius:20px}.summary h2{margin:0 0 22px}.summary-row{display:flex;justify-content:space-between;gap:16px;margin:15px 0;color:var(--muted)}.summary-row.total{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;font-size:20px;font-weight:950;color:var(--ink)}.shipping-note{font-size:13px;line-height:1.55;color:var(--muted);margin:20px 0}.checkout{width:100%;border:0;border-radius:13px;padding:16px;background:var(--brown);color:white;font-weight:900}.continue{display:block;text-align:center;margin-top:16px;color:var(--blue);font-weight:800;text-decoration:none}.empty-cart{grid-column:1/-1;text-align:center;background:var(--white);padding:70px 24px;border:1px solid var(--line);border-radius:20px}.empty-cart h2{margin:0 0 8px}.empty-cart p{color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:white;padding:14px 20px;border-radius:14px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-main{margin-top:36px}}@media(max-width:600px){.cart-header{min-height:78px;padding:10px 4%;gap:10px}.brand-logo{width:220px;height:58px;transform:translateX(-8px)}.back-link{padding:11px 12px;font-size:13px;white-space:nowrap}.cart-main{width:92%;margin:28px auto 60px}.cart-heading{display:block;margin-bottom:20px}.cart-heading h1{font-size:36px}.cart-item{grid-template-columns:88px minmax(0,1fr);gap:13px;padding:12px}.item-image{width:88px;height:100px}.item-name{font-size:16px;margin:4px 0 9px}.item-price{grid-column:2;justify-self:start;font-size:16px}.item-controls{gap:8px}.size-select{padding:8px}.quantity button{width:31px;height:33px}.quantity span{min-width:30px}.summary{padding:20px}}
</style>
</head>
<body>
<header class="cart-header"><a href="stepforge-30-products-responsive%203.html" aria-label="Back to StepForge"><img class="brand-logo" src="stepforge-logo.png" alt="StepForge Sneaker Store"></a><a class="back-link" href="stepforge-30-products-responsive%203.html">← Continue shopping</a></header>
<main class="cart-main"><div class="cart-heading"><div><h1>Your shopping cart</h1><p id="cartSubtitle">Review your selected pairs and sizes.</p></div></div><div class="cart-layout"><section class="cart-items" id="cartItems" aria-label="Cart items"></section><aside class="summary"><h2>Order summary</h2><div class="summary-row"><span>Subtotal</span><strong id="subtotal">₦0</strong></div><div class="summary-row"><span>Shipping</span><strong>Free</strong></div><div class="summary-row total"><span>Total</span><strong id="total">₦0</strong></div><p class="shipping-note">Shipping is free. Delivery typically takes 3–5 business days. Unworn items may be returned within 30 days of delivery.</p><button class="checkout" id="checkout">Proceed to checkout</button><a class="continue" href="stepforge-30-products-responsive%203.html">Continue shopping</a></aside></div></main><div class="toast" id="toast" role="status"></div>
<script src="assets/products.js"></script><script src="assets/store.js"></script><script src="assets/header-cart.js"></script><script src="assets/cart-page.js"></script>
</body>
</html>
